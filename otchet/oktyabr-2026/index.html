<head>

<title>Отчёт за октябрь 2026 · Nexus</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem('km-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Отчёт руководству за месяц. Стиль и поведение — как у карты системы и сайта юриста.
   Цифры в репозитории НЕ лежат (он открытый): страница берёт их из data.json, который отдаёт
   функция сайта из закрытой базы только после входа. */
:root{
  --ff:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--fs:'Instrument Serif',Georgia,serif;--fm:'JetBrains Mono',ui-monospace,monospace;
  --ez:cubic-bezier(.22,.8,.24,1);
  --bg:#12100E;--tx:#F4EFEA;--tx1:#E1D9D2;--tx2:#B9AFA6;--tx3:#857B73;--or:#E26612;--or2:#F2853A;--gold:#F6B46A;
  --ln:rgba(255,236,220,.09);--ln2:rgba(255,236,220,.16);--card:rgba(255,240,228,.035);--card2:rgba(255,240,228,.06);
  --glow:rgba(226,102,18,.22);--glass:rgba(20,17,15,.88);--hov:rgba(255,255,255,.06);
  --ok:#3ECF8E;--warn:#F6B46A;--bad:#F0607A;--blue:#7FB5FF;color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2EDE7;--tx:#1B1714;--tx1:#3A322C;--tx2:#5E554E;--tx3:#8A8078;--or:#C9560D;--or2:#C9560D;--gold:#A54A0C;
  --ln:rgba(52,36,24,.11);--ln2:rgba(52,36,24,.2);--card:#FFFFFF;--card2:#F7F2EC;--glow:rgba(201,86,13,.14);--glass:rgba(250,247,243,.9);--hov:rgba(52,36,24,.06);
  --ok:#1E8E5A;--warn:#A86A10;--bad:#C2284A;--blue:#2F6FD6;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2EDE7;--tx:#1B1714;--tx1:#3A322C;--tx2:#5E554E;--tx3:#8A8078;--or:#C9560D;--or2:#C9560D;--gold:#A54A0C;
  --ln:rgba(52,36,24,.11);--ln2:rgba(52,36,24,.2);--card:#FFFFFF;--card2:#F7F2EC;--glow:rgba(201,86,13,.14);--glass:rgba(250,247,243,.9);--hov:rgba(52,36,24,.06);
  --ok:#1E8E5A;--warn:#A86A10;--bad:#C2284A;--blue:#2F6FD6;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#12100E;--tx:#F4EFEA;--tx1:#E1D9D2;--tx2:#B9AFA6;--tx3:#857B73;--or:#E26612;--or2:#F2853A;--gold:#F6B46A;
  --ln:rgba(255,236,220,.09);--ln2:rgba(255,236,220,.16);--card:rgba(255,240,228,.035);--card2:rgba(255,240,228,.06);
  --glow:rgba(226,102,18,.22);--glass:rgba(20,17,15,.88);--hov:rgba(255,255,255,.06);--ok:#3ECF8E;--warn:#F6B46A;--bad:#F0607A;--blue:#7FB5FF;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}[hidden]{display:none!important}
::selection{background:var(--or);color:#fff}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px;border-radius:10px}
.aura{position:fixed;inset:-20vh -10vw auto auto;width:70vw;height:70vh;background:radial-gradient(closest-side,var(--glow),transparent 70%);filter:blur(30px);pointer-events:none;z-index:0}
.grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 70% 0%,#000 0%,transparent 60%);mask-image:radial-gradient(ellipse at 70% 0%,#000 0%,transparent 60%);opacity:.5}

/* шапка — как у юриста: крупная прозрачная → стеклянная плашка при прокрутке */
.s-nav{--k:0;position:fixed;z-index:30;left:0;right:0;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 20px - 6px * var(--k));height:calc(92px - 28px * var(--k));width:min(calc(1240px - 80px * var(--k)),calc(100% - 32px));
  display:flex;align-items:center;gap:16px;padding:0 10px 0 16px;border-radius:18px;transition:top .5s var(--ez),height .5s var(--ez),width .5s var(--ez);view-transition-name:head}
.s-nav::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;pointer-events:none;border:1px solid var(--ln);background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:0 12px 40px rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:opacity .45s ease-out,visibility 0s .45s}
.s-nav.compact::before{opacity:1;visibility:visible;transition:opacity .45s ease-out,visibility 0s}
.brand{display:flex;align-items:center;gap:11px;flex:none;transform:scale(calc(1.22 - .22 * var(--k)));transform-origin:0 50%;margin-right:calc(40px * (1 - var(--k)));transition:transform .5s var(--ez),margin .5s var(--ez);border-radius:12px}
.brand .mk{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--or2),var(--or));color:#fff;font-family:var(--fs);font-size:21px;box-shadow:0 6px 20px var(--glow)}
.brand .wm{display:flex;flex-direction:column;line-height:1}.brand .wm b{font-weight:600;font-size:16px}.brand .wm small{font-family:var(--fm);font-size:10px;letter-spacing:.2em;color:var(--tx3);margin-top:5px}
.s-nav nav{position:relative;display:flex;gap:2px;margin:0 auto}
.s-nav nav a{position:relative;z-index:1;display:inline-flex;align-items:center;height:38px;padding:0 13px;border-radius:11px;font-size:14.5px;color:var(--tx2);transition:color .2s,background-color .25s var(--ez)}
.s-nav nav a:hover{color:var(--tx);background:var(--hov)}.s-nav nav a.on{color:var(--tx)}
.s-ind{position:absolute;top:0;height:38px;border-radius:11px;background:color-mix(in srgb,var(--or) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--or2) 45%,transparent),inset 0 0 16px -6px color-mix(in srgb,var(--or2) 70%,transparent);transition:left .45s var(--ez),width .45s var(--ez),opacity .3s;pointer-events:none}
.s-nav-r{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--ln2);background:transparent;font-size:14px;font-weight:500;color:var(--tx1);cursor:pointer;transition:background-color .25s var(--ez),border-color .25s var(--ez),color .2s,box-shadow .25s var(--ez)}
.btn:hover{color:var(--tx);border-color:color-mix(in srgb,var(--or2) 60%,transparent);background:color-mix(in srgb,var(--or) 12%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--or) 10%,transparent)}
.btn svg{width:17px;height:17px}
@media (max-width:860px){.s-nav nav{display:none}}
@media (max-width:560px){.s-nav{width:calc(100% - 24px);top:calc(env(safe-area-inset-top,0px) + 10px);height:calc(70px - 10px * var(--k));padding:0 8px 0 10px}.brand{transform:none;margin-right:0}.btn .tl{display:none}.btn{padding:0 11px}}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-top:150px;padding-bottom:40px;outline:none}@media (max-width:560px){main{padding-top:100px}}
.view{display:grid;gap:22px}
.kicker{font-family:var(--fm);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--or2)}
h1{font-size:clamp(36px,6vw,70px);line-height:1.03;letter-spacing:-.03em;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.4vw,50px);line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:0;text-wrap:balance}
h1 .serif,h2 .serif{color:var(--or2)}.serif{font-family:var(--fs);font-style:italic;font-weight:400}
h3.sub{font-size:20px;font-weight:600;margin:14px 0 0}
.lead{color:var(--tx2);font-size:17px;max-width:70ch;margin:0}.lead b{color:var(--tx)}
.head-blk{display:grid;gap:12px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--tx3)}
.crumbs a{color:var(--tx2);padding:3px 8px;border-radius:8px;transition:background-color .2s,color .2s}.crumbs a:hover{background:var(--hov);color:var(--tx)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;border:1px solid var(--ln2);background:var(--card);font-size:13.5px;color:var(--tx1);cursor:pointer;transition:background-color .25s var(--ez),border-color .25s var(--ez),color .2s,box-shadow .25s var(--ez)}
.chip-b:hover{border-color:color-mix(in srgb,var(--or2) 60%,transparent);background:color-mix(in srgb,var(--or) 10%,transparent);color:var(--tx)}
.chip-b.on{border-color:color-mix(in srgb,var(--or2) 70%,transparent);background:color-mix(in srgb,var(--or) 16%,transparent);color:var(--tx);box-shadow:0 0 0 4px color-mix(in srgb,var(--or) 10%,transparent)}
.chip-b em{font-style:normal;font-family:var(--fm);font-size:11.5px;color:var(--tx3)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.card{position:relative;border:1px solid var(--ln);background:var(--card);border-radius:22px;padding:20px 22px;min-width:0;display:grid;gap:12px;align-content:start;overflow:hidden;transition:border-color .3s var(--ez),transform .3s var(--ez),box-shadow .3s var(--ez)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--or) 14%,transparent),transparent 60%)}
a.card:hover,.card.hov:hover{border-color:color-mix(in srgb,var(--or2) 45%,transparent);transform:translateY(-2px);box-shadow:0 18px 40px -22px var(--glow)}
a.card:hover::after,.card.hov:hover::after{opacity:1}
.card .n{font-family:var(--fm);font-size:11.5px;color:var(--or2);letter-spacing:.12em;text-transform:uppercase}
.card h3,.card h4{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.card p{margin:0;color:var(--tx2);font-size:14px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.go{font-size:13.5px;font-weight:500;color:var(--tx1);transition:color .2s}a.card:hover .go{color:var(--or2)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr));gap:12px}
.tile{border:1px solid var(--ln);background:var(--card);border-radius:18px;padding:16px 18px;display:grid;gap:6px}
.tile b{font-family:var(--fs);font-style:italic;font-weight:400;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--tx2)}.tile small{font-family:var(--fm);font-size:11px;color:var(--tx3)}
.tile.or b{color:var(--or2)}.tile.ok b{color:var(--ok)}.tile.bl b{color:var(--blue)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{display:grid;gap:2px;padding:9px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--ln)}
.mini b{font-family:var(--fs);font-style:italic;font-weight:400;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.mini span{font-family:var(--fm);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.conv{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--fm);font-size:11px;letter-spacing:.06em;padding:4px 9px;border-radius:999px;border:1px solid var(--ln2);color:var(--tx2)}
.pill b{color:var(--tx);font-weight:500}

.chart{border:1px solid var(--ln);background:var(--card);border-radius:22px;padding:18px 20px;display:grid;gap:10px}
.chart .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart .tt b{font-size:15px;font-weight:600}.chart .tt small{font-family:var(--fm);font-size:11px;color:var(--tx3)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--tx3);font-family:var(--fm);font-size:10px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}

.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(6,minmax(0,1fr));gap:10px;align-items:center;border:1px solid var(--ln);background:var(--card);border-radius:16px;padding:12px 16px;transition:border-color .25s var(--ez),transform .25s var(--ez)}
.row:hover{border-color:color-mix(in srgb,var(--or2) 40%,transparent)}
a.row:hover{transform:translateY(-1px)}
.row.hd{background:transparent;border-color:transparent;padding-block:0;font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.row .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}.row .nm small{display:block;font-weight:400;font-size:12px;color:var(--tx3)}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}.row .v small{display:block;font-size:11.5px;color:var(--tx3)}
.row.hd .v{text-align:right}
@media (max-width:760px){.row{grid-template-columns:repeat(3,minmax(0,1fr))}.row .nm{grid-column:1/-1}.row.hd{display:none}.row .v{text-align:left}.row .v::before{content:attr(data-l);display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}}

.check{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:8px 14px;align-items:center;font-variant-numeric:tabular-nums}
.check .h{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.check .r{text-align:right}.d0{color:var(--ok)}.d1{color:var(--warn)}
.note{font-size:13px;color:var(--tx2);border-left:2px solid var(--or2);padding:4px 0 4px 12px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--ln2);background:var(--card);border-radius:14px;padding:0 14px;height:46px;max-width:420px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--or2);box-shadow:0 0 0 4px color-mix(in srgb,var(--or) 12%,transparent)}
.search input{flex:1;border:0;background:transparent;color:var(--tx);font:500 15px var(--ff);outline:none;min-width:0}
.err{border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad);border-radius:16px;padding:14px 16px}
footer{position:relative;z-index:1;padding-block:26px 50px;color:var(--tx3);font-size:12.5px;font-family:var(--fm)}footer .wrap{border-top:1px solid var(--ln);padding-top:20px}

::view-transition-group(head),::view-transition-new(head){animation:none}::view-transition-old(head){display:none}
::view-transition-old(root){animation:vtOut .22s cubic-bezier(.4,0,1,1) both}::view-transition-new(root){animation:vtIn .5s var(--ez) .06s both}
@keyframes vtOut{to{opacity:0;transform:translateY(-10px)}}@keyframes vtIn{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}.s-nav,.brand,.card{transition:none}}


/* ═════ панель справа: спейс, бот, сотрудник открываются сбоку, страница остаётся на месте ═════ */
.dim{position:fixed;inset:0;z-index:40;background:rgba(8,6,5,.5);opacity:0;pointer-events:none;transition:opacity .35s ease-out}
.dim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(max(50vw,600px),100vw);background:var(--bg);border-left:1px solid var(--ln2);box-shadow:-30px 0 80px -30px rgba(0,0,0,.6);
  transform:translateX(102%);transition:transform .45s var(--ez);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer::before{content:"";position:absolute;inset:0 0 auto 0;height:260px;background:radial-gradient(60% 100% at 80% 0%,var(--glow),transparent 70%);pointer-events:none;opacity:.7}
.dr-hd{position:relative;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;border-bottom:1px solid var(--ln)}
.dr-hd .t{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--ln2);background:transparent;cursor:pointer;color:var(--tx1);transition:background-color .25s var(--ez),border-color .25s var(--ez),box-shadow .25s var(--ez),color .2s}
.ic:hover{color:var(--tx);border-color:color-mix(in srgb,var(--or2) 60%,transparent);background:color-mix(in srgb,var(--or) 12%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--or) 10%,transparent)}
.ic svg{width:17px;height:17px}
.dr-bd{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 20px 40px;display:grid;gap:18px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--ln2) transparent}
.dr-bd h2{font-size:clamp(26px,3vw,36px)}
.dr-bd .tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr))}.dr-bd .tile b{font-size:30px}
.dr-bd .charts{grid-template-columns:1fr 1fr}@media (max-width:700px){.dr-bd .charts{grid-template-columns:1fr}}
.dr-bd .row{grid-template-columns:minmax(0,1.5fr) repeat(5,minmax(0,1fr))}
.dr-bd .row .v.leads{display:none}.dr-bd .row.wl{grid-template-columns:minmax(0,1.5fr) repeat(6,minmax(0,1fr))}.dr-bd .row.wl .v.leads{display:block}
@media (max-width:760px){.dr-bd .row,.dr-bd .row.wl{grid-template-columns:repeat(3,minmax(0,1fr))}}
body.lock{overflow:hidden}
button.row{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.row:hover,button.card:hover{border-color:color-mix(in srgb,var(--or2) 45%,transparent)}
button.card{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
button.card:hover{transform:translateY(-2px);box-shadow:0 18px 40px -22px var(--glow)}button.card:hover::after{opacity:1}button.card:hover .go{color:var(--or2)}
.bu{font-family:var(--fm);font-size:12px;color:var(--or2)}
/* игроки: строка с кнопками в Jarvis и Chatterfy (открываются в новой вкладке браузера) */
.pl{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,.8fr)) auto;gap:10px;align-items:center;border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:10px 14px;transition:border-color .25s var(--ez)}
.pl:hover{border-color:color-mix(in srgb,var(--or2) 40%,transparent)}
.pl .id{font-family:var(--fm);font-size:13.5px;color:var(--tx)}.pl .id small{display:block;font-family:var(--ff);font-size:12px;color:var(--tx3);overflow-wrap:anywhere}
.pl .v{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}.pl .v small{display:block;font-size:11px;color:var(--tx3)}
.pl .bt{display:flex;gap:6px;justify-content:flex-end}
.lnk{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--ln2);font-size:12.5px;font-weight:500;color:var(--tx1);white-space:nowrap;transition:background-color .25s var(--ez),border-color .25s var(--ez),color .2s,box-shadow .25s var(--ez)}
.lnk:hover{color:var(--tx);border-color:color-mix(in srgb,var(--or2) 60%,transparent);background:color-mix(in srgb,var(--or) 12%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--or) 10%,transparent)}
.lnk.off{opacity:.35;pointer-events:none}
@media (max-width:640px){.pl{grid-template-columns:repeat(3,minmax(0,1fr))}.pl .id{grid-column:1/-1}.pl .bt{grid-column:1/-1;justify-content:flex-start}.pl .v{text-align:left}}
.more{justify-self:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* ═════ поиск-лупа, как в нашей CRM: квадрат 40px, при наведении плавно раскрывается, сразу можно писать ═════ */
.sx{position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;width:40px;padding:0 11px;border-radius:12px;border:1px solid var(--ln2);background:var(--card);overflow:hidden;cursor:pointer;color:var(--tx2);
  transition:width .34s var(--ez),border-color .2s var(--ez),box-shadow .24s var(--ez),color .2s}
.sx svg{flex:none;width:17px;height:17px}
.sx input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:500 14px var(--ff);opacity:0;transition:opacity .15s var(--ez)}
.sx.on{width:min(280px,100%);cursor:text;color:var(--tx);border-color:color-mix(in srgb,var(--or2) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--or) 10%,transparent)}
.sx.on input{opacity:1;transition:opacity .2s .1s var(--ez)}
.sx:hover{color:var(--tx);border-color:color-mix(in srgb,var(--or2) 60%,transparent)}

/* печать / PDF: все страницы подряд, каждая с новой страницы, светлая тема */
@page{margin:14mm 12mm}
@media print{
  :root,:root[data-theme]{--bg:#fff;--tx:#111;--tx1:#222;--tx2:#444;--tx3:#777;--or:#C9560D;--or2:#C9560D;--ln:#e5ddd5;--ln2:#d5cabf;--card:#fff;--card2:#faf6f2;--ok:#1E8E5A;--warn:#A86A10;--blue:#2F6FD6;color-scheme:light}
  .aura,.grid,.s-nav,.no-print{display:none!important}main{padding-top:0}
  .view{break-before:page;display:grid!important}.view:first-child{break-before:auto}
  .card,.row,.tile,.chart{break-inside:avoid}
  .charts{grid-template-columns:1fr 1fr}.chart svg{max-height:150px}
  .row{padding:7px 12px;border-radius:10px}.rows{gap:5px}a.card:hover,.row:hover{transform:none}
}
</style>
